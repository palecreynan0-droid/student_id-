<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Dashboard</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

  
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Restaurant Dashboard</a>
    <div class="d-flex align-items-center">
      <span class="navbar-text me-3">Welcome, <span id="userName">User</span></span>
      <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
    </div>
  </div>
</nav>

<!-- Sidebar + Main Content -->
<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <nav class="col-md-2 d-none d-md-block bg-white sidebar py-4">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link active" href="#">Dashboard</a></li>
        <!-- Add more links if needed -->
      </ul>
    </nav>

    <!-- Main Content -->
    <main class="col-md-10 ms-sm-auto px-4" id="mainContent">
      <h1 class="mt-4" id="greeting">Good Day!</h1>

      <!-- Key Metrics -->
      <div class="row mb-4" id="statsCards">
        <!-- Cards will be populated by JS -->
        <div class="col-md-3 mb-3">
          <div class="card bg-warning text-white h-100" id="stat1">
            <div class="card-body text-center">
              <h5 class="card-title" id="stat1-title">Orders</h5>
             
              <p class="card-text" id="stat1-value">0</p>
            </div>
          </div>
        </div>
     
         <div class="col-md-3 mb-3">
          <div class="card bg-warning text-white h-100" id="stat2">
            <div class="card-body text-center">
              <h5 class="card-title" id="stat2-title">Revenue</h5>
             
              <p class="card-text" id="stat2-value">0</p>
            </div>
          </div>
        </div>

         <div class="col-md-3 mb-3">
          <div class="card bg-warning text-white h-100" id="stat3">
            <div class="card-body text-center">
              <h5 class="card-title" id="stat3-title">Tables</h5>
             
              <p class="card-text" id="stat3-value">0</p>
            </div>
          </div>
        </div>


     


         <div class="col-md-3 mb-3">
          <div class="card bg-warning text-white h-100" id="stat4">
            <div class="card-body text-center">
              <h5 class="card-title" id="stat4-title">Popular Dish</h5>
             
              <p class="card-text" id="stat4-value">0</p>
            </div>
          </div>
        </div>




      </div>

      <!-- Recent Activities -->
      <h3>Recent Orders</h3>
      <table class="table table-striped" id="activityTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Order ID</th>
            <th>Name</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
  </div>
</div>

<script src="js/dashboard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
