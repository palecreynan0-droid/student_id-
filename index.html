<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gradient-restaurant d-flex justify-content-center align-items-center vh-100">

  <div class="card shadow-lg" style="width: 400px;">
    <div class="card-header text-center bg-primary text-white">
      <h3>Restaurant Management Login</h3>
    </div>
    <div class="card-body p-4">
      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter username" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter password" required />
        </div>
        <button type="button" id="loginBtn" class="btn btn-primary w-100">Login</button>
      </form>
      <div id="errorMsg" class="mt-3 text-danger d-none"></div>
    </div>
  </div>

<script src="js/login.js"></script>
</body>
</html>
